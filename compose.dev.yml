services:
  postgres:
    image: postgres:17-alpine
    container_name: workerbee-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-workerbee}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - workerbee-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-workerbee}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workerbee-pg-data:
