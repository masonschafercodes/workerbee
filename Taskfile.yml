version: "3"

dotenv:
  - .env.dev

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  setup:
    desc: Install dependencies, create .env.dev, start Postgres, migrate, and create the test database
    cmds:
      - |
        if [ ! -f .env.dev ]; then
          cp .env.dev.example .env.dev
        fi
      - |
        if grep -q '^BETTER_AUTH_SECRET=change-me' .env.dev; then
          secret=$(openssl rand -hex 32)
          BETTER_AUTH_SECRET_VALUE="$secret" \
            perl -0pi -e 's/^BETTER_AUTH_SECRET=.*$/BETTER_AUTH_SECRET=$ENV{BETTER_AUTH_SECRET_VALUE}/m' .env.dev
        fi
      - bun install
      - |
        set -a
        . ./.env.dev
        set +a
        task db:up
      - |
        set -a
        . ./.env.dev
        set +a
        bun run --cwd packages/db migrate

  dev:
    desc: Run the API and web app together
    deps:
      - dev:api
      - dev:web

  dev:api:
    desc: Run the API on port 3001
    cmds:
      - bun run --cwd apps/api dev

  dev:web:
    desc: Run the web app on port 5173
    cmds:
      - bun run --cwd apps/web dev

  design:
    desc: Run the design gallery on port 5173
    cmds:
      - bun run --cwd apps/design dev

  check:
    desc: Typecheck and run all tests
    cmds:
      - bun run check

  test:
    desc: Run all tests
    cmds:
      - bun test

  test:e2e:
    desc: Run the HTTP end-to-end suites
    cmds:
      - bun test packages/e2e

  smoke:dev:
    desc: Verify the deployed dev app through two authenticated WebSocket clients
    cmds:
      - |
        smoke_url="${WORKERBEE_URL:-}"
        if [ -z "$smoke_url" ]; then
          hostname="${WORKERBEE_HOSTNAME:-$(awk -F= '$1 == "WORKERBEE_HOSTNAME" { print $2; exit }' infra/envs/dev/deploy.env 2>/dev/null)}"
          if [ -z "$hostname" ]; then
            echo "Set WORKERBEE_URL or WORKERBEE_HOSTNAME in infra/envs/dev/deploy.env" >&2
            exit 1
          fi
          smoke_url="https://${hostname}"
        fi
        WORKERBEE_URL="$smoke_url" bun run scripts/smoke-dev.ts

  wrangler:types:
    desc: Generate Cloudflare binding types from Wrangler configs
    cmds:
      - bun run wrangler types apps/api/worker-configuration.d.ts --config apps/api/wrangler.jsonc --env-interface ApiEnv --include-runtime=false --strict-vars=false
      - bun run wrangler types apps/hub/worker-configuration.d.ts --config apps/hub/wrangler.jsonc --env-interface HubEnv --include-runtime=false --strict-vars=false
      - bun run wrangler types apps/web/worker-configuration.d.ts --config apps/web/wrangler.jsonc --env-interface WebEnv --include-runtime=false --strict-vars=false

  wrangler:types:check:
    desc: Check generated Cloudflare binding types against Wrangler configs
    cmds:
      - bun run wrangler types apps/api/worker-configuration.d.ts --config apps/api/wrangler.jsonc --env-interface ApiEnv --include-runtime=false --strict-vars=false --check
      - bun run wrangler types apps/hub/worker-configuration.d.ts --config apps/hub/wrangler.jsonc --env-interface HubEnv --include-runtime=false --strict-vars=false --check
      - bun run wrangler types apps/web/worker-configuration.d.ts --config apps/web/wrangler.jsonc --env-interface WebEnv --include-runtime=false --strict-vars=false --check

  wrangler:dry-run:
    desc: Build and validate the API, hub, and web Worker configs without deployment
    deps:
      - build
      - wrangler:types:check
    cmds:
      - bun run scripts/generate-wrangler-configs.ts --example
      - bun run --bun wrangler deploy --dry-run --config apps/hub/wrangler.generated.jsonc
      - bun run --bun wrangler deploy --dry-run --config apps/api/wrangler.generated.jsonc
      - bun run --bun wrangler deploy --dry-run --config apps/web/wrangler.generated.jsonc

  build:
    desc: Build the web app and the design gallery
    cmds:
      - bun run --cwd apps/web build
      - bun run --cwd apps/design build

  db:up:
    desc: Start local Postgres unless one is already listening, then ensure the test database
    cmds:
      - |
        if bun -e 'const socket = await Bun.connect({ hostname: "127.0.0.1", port: 5432, socket: { data() {} } }).catch(() => null); if (socket === null) process.exit(1); socket.end()'; then
          echo "Postgres is already listening on 127.0.0.1:5432"
        else
          ${CONTAINER_CMD:-docker compose} -f compose.dev.yml up -d
          i=0
          while [ "$i" -lt 30 ]; do
            if ${CONTAINER_CMD:-docker compose} -f compose.dev.yml exec -T postgres \
              pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-workerbee}" >/dev/null 2>&1; then
              break
            fi
            i=$((i + 1))
            sleep 1
          done
          if [ "$i" -ge 30 ]; then
            echo "Postgres did not become ready" >&2
            exit 1
          fi
        fi
      - task: db:test-db

  db:test-db:
    desc: Create the test database if it is missing
    cmds:
      - bun run --cwd packages/db ensure-test-db

  db:down:
    desc: Stop local Postgres and keep its data
    cmds:
      - ${CONTAINER_CMD:-docker compose} -f compose.dev.yml down

  db:reset:
    desc: Stop local Postgres and delete its data
    prompt: This deletes the local database. Continue?
    cmds:
      - ${CONTAINER_CMD:-docker compose} -f compose.dev.yml down -v

  db:logs:
    desc: Follow local Postgres logs
    cmds:
      - ${CONTAINER_CMD:-docker compose} -f compose.dev.yml logs -f postgres

  db:migrate:
    desc: Apply database migrations
    cmds:
      - bun run --cwd packages/db migrate

  db:generate:
    desc: Generate a migration from schema changes
    cmds:
      - bun run --cwd packages/db generate

  db:studio:
    desc: Open Drizzle Studio
    cmds:
      - bun run --cwd packages/db studio

  db:reset-auth:
    desc: Clear JWKS keys and sessions after changing BETTER_AUTH_SECRET
    cmds:
      - bun run --cwd packages/db reset-auth

  db:auth-schema:
    desc: Regenerate Better Auth tables and a migration
    cmds:
      - bunx --bun auth@1.7.13 generate --cwd packages/auth --config src/cli.ts --output ../db/src/schema/auth.ts --adapter drizzle --dialect postgresql -y
      - task: db:generate

  infra:fmt:
    desc: Format OpenTofu files
    cmds:
      - tofu fmt -recursive infra

  infra:bootstrap:
    desc: Create the R2 state bucket once using Cloudflare credentials in deploy.env
    cmds:
      - |
        set -eu
        if [ -f infra/envs/dev/deploy.env ]; then
          set -a
          . infra/envs/dev/deploy.env
          set +a
        fi
        : "${TF_VAR_account_id:?Copy deploy.env.example and set TF_VAR_account_id}"
        : "${TF_VAR_cloudflare_api_token:?Set TF_VAR_cloudflare_api_token in deploy.env}"
        tofu -chdir=infra/bootstrap init -input=false
        tofu -chdir=infra/bootstrap apply -input=false

  infra:init:
    desc: Generate backend.hcl and initialize the dev OpenTofu backend
    cmds:
      - bash scripts/with-deploy-env.sh bun run scripts/write-dev-backend.ts
      - bash scripts/with-deploy-env.sh tofu -chdir=infra/envs/dev init -input=false -backend-config=backend.hcl

  infra:plan:
    desc: Plan dev infrastructure using the configured hostname
    deps:
      - infra:init
    cmds:
      - bash scripts/with-deploy-env.sh bun run scripts/tofu-dev.ts plan

  infra:apply:
    desc: Apply dev infrastructure using the configured hostname
    deps:
      - infra:init
    cmds:
      - bash scripts/with-deploy-env.sh bun run scripts/tofu-dev.ts apply

  infra:bindings:
    desc: Generate committed Wrangler bindings from dev OpenTofu outputs
    deps:
      - infra:init
    cmds:
      - bash scripts/with-deploy-env.sh bun run scripts/generate-wrangler-configs.ts --from-tofu

  infra:bindings:check:
    desc: Check committed Wrangler bindings against dev OpenTofu outputs
    deps:
      - infra:init
    cmds:
      - bash scripts/with-deploy-env.sh bun run scripts/generate-wrangler-configs.ts --check-tofu

  infra:validate:
    desc: Validate the dev OpenTofu environment without a backend
    cmds:
      - tofu -chdir=infra/envs/dev init -backend=false -input=false
      - tofu -chdir=infra/envs/dev validate

  deploy:dev:
    desc: Deploy dev Workers and bind the configured hostname
    deps:
      - build
    cmds:
      - |
        set -eu
        if [ -f infra/envs/dev/deploy.env ]; then
          set -a
          . infra/envs/dev/deploy.env
          set +a
        fi
        : "${WORKERBEE_HOSTNAME:?Copy infra/envs/dev/deploy.env.example to deploy.env and fill it in}"
        : "${TF_VAR_account_id:?Set TF_VAR_account_id in infra/envs/dev/deploy.env}"
        : "${TF_VAR_cloudflare_api_token:?Set TF_VAR_cloudflare_api_token in infra/envs/dev/deploy.env}"
        : "${TF_VAR_neon_org_id:?Set TF_VAR_neon_org_id in infra/envs/dev/deploy.env}"
        : "${NEON_API_KEY:?Set NEON_API_KEY in infra/envs/dev/deploy.env}"
        : "${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in infra/envs/dev/deploy.env}"
        : "${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in infra/envs/dev/deploy.env}"
        : "${BETTER_AUTH_SECRET:?Run task setup first}"
        export CLOUDFLARE_ACCOUNT_ID="$TF_VAR_account_id"
        export CLOUDFLARE_API_TOKEN="$TF_VAR_cloudflare_api_token"
        tofu -chdir=infra/envs/dev init -input=false -backend-config=backend.hcl
        current_hostname=$(tofu -chdir=infra/envs/dev output -raw web_hostname 2>/dev/null || true)
        config_hostname="${current_hostname:-$WORKERBEE_HOSTNAME}"
        bun run scripts/tofu-dev.ts apply --hostname "$current_hostname"
        bun run scripts/generate-wrangler-configs.ts --from-tofu --hostname "$config_hostname"
        bun run scripts/migrate-dev-db.ts
        bun run --bun wrangler deploy --config apps/hub/wrangler.generated.jsonc
        bun run scripts/set-worker-secret.ts apps/hub/wrangler.generated.jsonc
        bun run --bun wrangler deploy --config apps/api/wrangler.generated.jsonc
        bun run scripts/set-worker-secret.ts apps/api/wrangler.generated.jsonc
        bun run --bun wrangler deploy --config apps/web/wrangler.generated.jsonc
        bun run scripts/tofu-dev.ts apply --hostname "$WORKERBEE_HOSTNAME"
        bun run scripts/generate-wrangler-configs.ts --from-tofu
        if [ "$config_hostname" != "$WORKERBEE_HOSTNAME" ]; then
          bun run --bun wrangler deploy --config apps/api/wrangler.generated.jsonc
          bun run scripts/set-worker-secret.ts apps/api/wrangler.generated.jsonc
        fi
        bun run scripts/generate-wrangler-configs.ts --check-tofu
        bun run scripts/tofu-dev.ts check --hostname "$WORKERBEE_HOSTNAME"
        unset TF_VAR_account_id TF_VAR_cloudflare_api_token TF_VAR_neon_org_id NEON_API_KEY
        unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
        unset DATABASE_URL TEST_DATABASE_URL
        WORKERBEE_URL="https://${WORKERBEE_HOSTNAME}" bun run scripts/smoke-dev.ts
