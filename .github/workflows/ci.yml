name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workerbee
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/workerbee
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run --cwd apps/design build
      - run: bun run --cwd apps/web build
      - run: bun run wrangler types apps/api/worker-configuration.d.ts --config apps/api/wrangler.jsonc --env-interface ApiEnv --include-runtime=false --strict-vars=false --check
      - run: bun run wrangler types apps/hub/worker-configuration.d.ts --config apps/hub/wrangler.jsonc --env-interface HubEnv --include-runtime=false --strict-vars=false --check
      - run: bun run wrangler types apps/web/worker-configuration.d.ts --config apps/web/wrangler.jsonc --env-interface WebEnv --include-runtime=false --strict-vars=false --check
      - run: bun run scripts/generate-wrangler-configs.ts --example
      - run: bun run --bun wrangler deploy --dry-run --config apps/hub/wrangler.generated.jsonc
      - run: bun run --bun wrangler deploy --dry-run --config apps/api/wrangler.generated.jsonc
      - run: bun run --bun wrangler deploy --dry-run --config apps/web/wrangler.generated.jsonc

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.2"
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra/envs/dev init -backend=false -input=false
      - run: tofu -chdir=infra/envs/dev validate
